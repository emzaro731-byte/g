name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (standard, non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: |
          godot --version
          case "$(godot --version)" in
            *mono*) echo "ERROR: .NET/Mono Godot was installed"; exit 1 ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/iPhoneLauncher.apk
          test -s build/iPhoneLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneLauncher-Android
          path: build/iPhoneLauncher.apk
